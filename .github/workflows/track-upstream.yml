name: Track upstream issues

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC
  workflow_dispatch:     # Allow manual trigger

jobs:
  check-claude-code-usage-api:
    name: Check anthropics/claude-code#21943
    runs-on: ubuntu-latest
    steps:
      - name: Check if issue is closed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE=$(gh api repos/anthropics/claude-code/issues/21943 --jq '.state')
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Open reminder issue if closed
        if: steps.check.outputs.state == 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: |
            The upstream feature request for programmatic access to Claude Pro/Max usage data has been closed:
            https://github.com/anthropics/claude-code/issues/21943

            ## What to do

            1. Check how the usage data is now exposed (local file, `/usage --json`, or API endpoint)
            2. In `packages/worker/src/index.ts`, read remaining quota before accepting a task
            3. Skip tasks whose `issue.estimatedTokens` would exceed the remaining quota
            4. Surface quota info in `tah contributor pledges` output

            See the roadmap note in README.md for context.

            _Opened automatically by the track-upstream workflow._
        run: |
          # Don't open a duplicate if one is already open
          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label upstream-resolved \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "Reminder issue already open — skipping."
            exit 0
          fi

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "anthropics/claude-code#21943 closed — implement token-budget awareness" \
            --label upstream-resolved \
            --body "$ISSUE_BODY"
