# fly.toml - Tokens at Home Coordinator
# Run `fly launch` to associate this with your Fly.io account,
# then `fly deploy` to deploy.

app = "tokens-at-home"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATABASE_URL = "/data/tah.db"
  # GITHUB_WEBHOOK_SECRET — set via: fly secrets set GITHUB_WEBHOOK_SECRET=<your-secret>

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # keep alive so workers can always poll
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume for SQLite
[[mounts]]
  source = "tah_data"
  destination = "/data"
  initial_size = "1gb"

